version: 0.0.29
type: plugin
# New AMD Token Factory identity; prior-ID saved credentials do not migrate automatically.
author: amdtokenfactory
name: amdtokenfactory
label:
  en_US: AMD Token Factory
  zh_Hans: AMD Token Factory
description:
  en_US: Open models on AMD GPUs for Dify, with a daily free quota, reasoning, tool calling, and vision.
  zh_Hans: 面向 Dify 的 AMD GPU 开源模型，提供每日免费额度，支持推理、工具调用和图片输入。
icon: icon.png
repo: https://github.com/JoursBleu/dify
contact: Letian.Kang@amd.com
created_at: "2026-10-12T00:00:00.000000000Z"
resource:
  memory: 268435456
  permission:
    model:
      enabled: true
      llm: true
network:
  domains:
    - developer.amd.com.cn
plugins:
  models:
    - provider/amdtokenfactory.yaml
meta:
  version: 0.0.2
  # Built-in predefined model declarations support stock Dify 1.17.1 / SDK 0.10.2.
  minimum_dify_version: 1.17.1
  arch:
    - amd64
    - arm64
  runner:
    language: python
    version: "3.12"
    entrypoint: main
privacy: PRIVACY.md
verified: false
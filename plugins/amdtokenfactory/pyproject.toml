[project]
name = "dify-plugin-amdtokenfactory"
version = "0.0.29"
description = "AMD Token Factory model provider for Dify"
authors = [{ name = "Letian Kang", email = "Letian.Kang@amd.com" }]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Released SDK supports the packaged predefined model declarations.
    "dify-plugin==0.10.2",
    "requests==2.34.2",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pyyaml==6.0.3",
    "ruff==0.15.22",
]

[tool.pytest.ini_options]
pythonpath = [".", "scripts"]
testpaths = ["tests"]
markers = ["live: calls the public AMD Token Factory API and requires an explicit test key"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]